name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore HdrBrightControl.csproj
      
    - name: Build
      run: dotnet build HdrBrightControl.csproj --configuration Release --no-restore
      
    - name: Publish
      run: |
        $publishDir = "./publish"
        if (Test-Path $publishDir) { Remove-Item $publishDir -Recurse -Force }
        New-Item -ItemType Directory -Path $publishDir | Out-Null
        
        dotnet publish HdrBrightControl.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -o $publishDir
      
    - name: Create ZIP package
      run: |
        $tag = "${{ github.ref_name }}"
        Compress-Archive -Path ./publish/* -DestinationPath "HdrBrightControl-${tag}.zip" -Force
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: HdrBrightControl-${{ github.ref_name }}.zip
        generate_release_notes: true
