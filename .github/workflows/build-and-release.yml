name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore HdrBrightControl.csproj
      
    - name: Build
      run: dotnet build HdrBrightControl.csproj --configuration Release --no-restore
      
    - name: Publish
      run: |
        dotnet publish HdrBrightControl.csproj -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -o ./publish
      
    - name: Create ZIP package
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath HdrBrightControl-v${{ github.ref_name }}.zip
        
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: HdrBrightControl-v${{ github.ref_name }}.zip
        generate_release_notes: true
        
    - name: Upload artifact (workflow_dispatch)
      uses: actions/upload-artifact@v4
      if: !startsWith(github.ref, 'refs/tags/')
      with:
        name: HdrBrightControl-${{ github.run_number }}
        path: ./publish/
